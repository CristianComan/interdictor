[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interdictor-sapient"
version = "0.1.0"
description = "Minimal BSI Flex 335 v2 SAPIENT effector (jammer) node"
requires-python = ">=3.11"
dependencies = [
  "protobuf>=5.27,<7",
  "grpcio-tools>=1.64",
  "PyYAML>=6.0",
  "ulid-py>=1.1.0",
]

[project.scripts]
interdictor = "interdictor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
